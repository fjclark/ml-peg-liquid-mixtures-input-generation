# Curated binary mixtures for the ml-peg binary_mixtures benchmark.
#
# `select_systems.py` checks every entry against the hard filters, and records
# the reason for any declared exception. The free-text fields feed the
# selection report. x always refers to component `a`.

systems:
  - id: pyrrole_pyridine
    a: c1cc[nH]c1
    b: c1ccncc1
    names: [pyrrole, pyridine]
    temperature: 298.15
    interaction: N-H···N hydrogen bond between an aromatic donor and acceptor
    rationale: >-
      Largest exothermic signal in the pool (-2.65 kJ/mol), single source paper
      for both properties, and Sage gets it badly wrong (MAE 1.9 kJ/mol).
    miscibility: >-
      Single liquid phase across the whole composition range in the source papers (see the single-phase evidence below).

  - id: methanol_water
    a: CO
    b: O
    names: [methanol, water]
    temperature: 298.15
    interaction: alcohol-water hydrogen-bond network
    # Densities from one paper only, which also reports both pure liquids, so
    # V^E and the box densities use the same pure values. 10.1021/je700300y
    # (12 points) is left out: it reports no pure water, and its pure methanol
    # (0.78657 g/mL) differs from this paper's (0.78720 g/mL).
    density_dois: [10.1016/j.jct.2007.05.004]
    exception: >-
      The rc2 density and ΔHmix compositions differ by up to |Δx| = 0.06
      (limit 0.05), and no data set gives water's pure density with an
      uncertainty. Kept because it is the aqueous calibration system (smallest
      Sage repeat spread in the pool) and both failures are artefacts of the
      screening data: the full ThermoML isotherms have a density within
      |Δx| ≤ 0.002 of every box composition, and water's pure density comes
      from [IAPWS-95](https://doi.org/10.1063/1.1461829).
    rationale: >-
      Smallest Sage repeat spread in the pool (0.03 kJ/mol), so it calibrates
      the noise of the protocol. Methanol and water pure densities are already
      scored in [ml-peg](https://github.com/ddmms/ml-peg/tree/8e52132f661fb3d46d5a245aa52b1d940ba22504/ml_peg/calcs/molecular_dynamics/liquid_densities) and are not re-scored.
    miscibility: >-
      Miscible in all proportions.

  - id: water_pyridine
    a: O
    b: c1ccncc1
    names: [water, pyridine]
    temperature: 303.15
    interaction: aromatic nitrogen-water hydrogen bonding
    extra_dois: [10.1021/je2002495]
    # The ThermoML record stores 298.15 K, but the paper's title and abstract
    # state the enthalpies were measured at 303.15 K.
    temperature_corrections: {10.1021/je2002495: 303.15}
    exception: >-
      Not in the Sage training or validation sets; the data come from the
      recommended fast-converging list. Screened, it would fail the entry
      filter (3 ΔHmix points but no mixture densities) and both no Sage repeat
      SD filters (no pyridine + water rows in the
      [rc2 benchmark outputs](https://github.com/openforcefield/ash-sage-rc2/tree/00c9524d38af53725a1a18feb3433f5c191cdb4a/04_benchmark/phys-prop/output)).
      The ΔHmix data are also at 303.15 K, outside the 297.0–299.5 K window (the
      [ThermoML record](https://trc.nist.gov/ThermoML/10.1021/je2002495.json)
      stores 298.15 K, but the [paper's title](https://doi.org/10.1021/je2002495)
      gives 303.15 K). Kept because it is the only aromatic-water system
      available. It is scored on ΔHmix only (unless ThermoML provides a
      303.15 K mixture density), and our own Sage replicates replace the
      missing repeat SDs for MAZE.
    rationale: Only aromatic-water system available; relevant to biomolecular recognition.
    miscibility: >-
      Miscible in all proportions at 303 K (enthalpies measured across x = 0.1–0.9).

  - id: nmp_dichloroethane
    a: CN1CCCC1=O
    b: ClCCCl
    names: [N-methyl-2-pyrrolidone, "1,2-dichloroethane"]
    temperature: 298.15
    interaction: tertiary amide with a chloroalkane (C-H···O=C, dipolar)
    # The two ΔHmix papers disagree away from equimolar: 10.1021/je020065c is
    # 0.15 kJ/mol less exothermic at x ≈ 0.2 (-0.68 vs -0.83) and 0.07 at
    # x ≈ 0.8 (-0.66 vs -0.73). 10.1016/j.jct.2008.01.024 has the smaller
    # uncertainties and matches the fit better, so it alone is used, at its
    # measured points nearest 0.2, 0.5 and 0.8.
    hmix_dois: [10.1016/j.jct.2008.01.024]
    target_x: [0.2, 0.5, 0.8]
    exception: >-
      The 3-point rc2 subsets miss the composition-match limit by a hair
      (|Δx| = 0.0503 vs 0.05). Kept because the full ThermoML isotherms remove
      the mismatch (largest box |Δx| = 0.006), and the system widens the
      exothermic range and is the only one with chlorine.
    rationale: >-
      Widens the exothermic range (-1.26 kJ/mol) and covers chlorine. Both
      pure densities are already in [ml-peg](https://github.com/ddmms/ml-peg/tree/8e52132f661fb3d46d5a245aa52b1d940ba22504/ml_peg/calcs/molecular_dynamics/liquid_densities).
    miscibility: >-
      Single liquid phase across the whole composition range in the source papers (see the single-phase evidence below).

  - id: acetone_nmethylaniline
    a: CC(C)=O
    b: CNc1ccccc1
    names: [acetone, N-methylaniline]
    temperature: 298.15
    interaction: aromatic N-H donor with a ketone acceptor
    rationale: Exothermic N-H···O=C association; adds an aromatic amine.
    miscibility: >-
      Single liquid phase across the whole composition range in the source papers (see the single-phase evidence below).

  - id: propanol_benzene
    a: CCCO
    b: c1ccccc1
    names: [1-propanol, benzene]
    temperature: 298.15
    interaction: alcohol self-association broken by an aromatic (O-H···π)
    rationale: >-
      Alcohol dilution case that also probes O-H···π, replacing isooctane +
      1-propanol. Both pure densities are already in [ml-peg](https://github.com/ddmms/ml-peg/tree/8e52132f661fb3d46d5a245aa52b1d940ba22504/ml_peg/calcs/molecular_dynamics/liquid_densities).
    miscibility: >-
      Single liquid phase across the whole composition range in the source papers (see the single-phase evidence below).

  - id: methylimidazole_ethanol
    a: Cn1ccnc1
    b: CCO
    names: [1-methylimidazole, ethanol]
    temperature: 298.15
    interaction: alcohol O-H donor with an imidazole N acceptor
    extra_dois: [10.1016/j.jct.2018.12.019]
    exception: >-
      Not in the Sage training or validation sets; found by the ThermoML
      archive screen (`archive_candidates.csv`), where it passes every filter
      that needs no Sage results. Our own Sage replicates replace the missing
      published repeat SDs.
    rationale: >-
      Only imidazole system (the histidine side-chain ring), replacing
      tetrahydropyran + ethanol at about the same cost. 1-Methylimidazole has
      no N-H, so this tests the imidazole N acceptor, not histidine's N-H
      tautomerism. ΔHmix and densities from one paper.
    miscibility: >-
      Exothermic and measured across the whole composition range in the
      source paper. Single liquid phase.

  - id: nma_water
    a: CNC(C)=O
    b: O
    names: [N-methylacetamide, water]
    temperature: 323.15
    interaction: peptide-bond model (trans secondary amide) hydrated by water
    extra_dois: [10.1021/je950294h, 10.1016/j.jct.2020.106233]
    # One paper per property: ΔHmix from de Haan and Gmehling (50 °C, entered
    # by hand in manual_points.csv, as the paper has no ThermoML record), and
    # densities with both pure liquids from Makarov et al.
    hmix_dois: [10.1021/je950294h]
    density_dois: [10.1016/j.jct.2020.106233]
    exception: >-
      Not in the Sage training or validation sets, and outside the 297–315 K
      screening window: N-methylacetamide melts near 301 K, and the only
      ΔHmix isotherm with matching densities is at 323.15 K. The ΔHmix paper
      predates ThermoML, so its 50 °C table is entered by hand
      (`manual_points.csv`, checked against the paper's Redlich-Kister fit),
      with the stated 1 % uncertainty as σ. Our own Sage replicates replace
      the missing published repeat SDs. Every N-methylacetamide starts trans.
    rationale: >-
      N-methylacetamide is the standard model of the peptide bond, and its
      hydration is the backbone's: the largest exothermic signal after pyrrole
      + pyridine (-1.71 kJ/mol). It is predominantly trans, and amide
      rotation is far slower than a run, so every molecule starts and stays
      trans (a small, documented bias from the missing cis minority).
    miscibility: >-
      Miscible in all proportions: both source papers measure the whole
      composition range at 323.15 K, and the mixture is strongly exothermic.

  - id: ethylacetate_ethanol
    a: CCOC(C)=O
    b: CCO
    names: [ethyl acetate, ethanol]
    temperature: 298.15
    interaction: alcohol O-H donor with an ester C=O acceptor
    extra_dois: [10.1021/je200595b, 10.1016/j.jct.2007.05.004]
    # ΔHmix from the only full isotherm. Three density papers agree at
    # equimolar (0.8526, 0.852, 0.852 g/mL); this one also reports both pure
    # liquids.
    hmix_dois: [10.1021/je200595b]
    density_dois: [10.1016/j.jct.2007.05.004]
    exception: >-
      The largest published Sage repeat SD is 0.12 kJ/mol (limit 0.10). Kept
      because it is the only ester system within the atom budget with a
      strong signal. Our own 5 Sage replicates have SDs of 0.13, 0.04 and
      0.07 kJ/mol; pooled, 0.088 kJ/mol, below the median floor of σ_Sage,
      so it is no noisier than the other systems in our smaller boxes.
    rationale: >-
      Only ester system, with the most common ester (as in lipid esters and
      acetylcholine): ethyl acetate's C=O and ether O accept ethanol's O-H,
      breaking alcohol self-association (+1.21 kJ/mol). Ethyl acetate + water
      would be more biological but is only partially miscible. Both pure
      densities are already in ml-peg and are not re-scored; the ethanol box
      is shared with 1-methylimidazole + ethanol.
    miscibility: >-
      Miscible in all proportions; ΔHmix is measured from x = 0.05 to 0.95
      and is below RT/2.

  - id: dipropylamine_dmf
    a: CCCNCCC
    b: CN(C)C=O
    names: [dipropylamine, "N,N-dimethylformamide"]
    temperature: 298.15
    interaction: secondary amine with a tertiary amide
    rationale: Endothermic amine/amide pair; dipropylamine is new to ml-peg.
    miscibility: >-
      Single liquid phase across the whole composition range in the source papers (see the single-phase evidence below).

  - id: propionitrile_taee
    a: CCC#N
    b: CCOC(C)(C)CC
    names: [propionitrile, tert-amyl ethyl ether]
    temperature: 298.15
    interaction: nitrile dipoles diluted in an ether
    rationale: >-
      Only nitrile system; both properties from one paper at identical
      compositions (data at 298.4 K). Neither component in ml-peg.
    miscibility: >-
      Single liquid phase across the whole composition range in the source papers (see the single-phase evidence below).

  - id: heptane_toluene
    a: CCCCCCC
    b: Cc1ccccc1
    names: [heptane, toluene]
    temperature: 298.15
    interaction: dispersion and π control (no polar groups)
    rationale: >-
      Non-polar control that separates dispersion/D3 errors from hydrogen-bond
      errors. Sage handles it well (MAE 0.14 kJ/mol).
    miscibility: >-
      Fully miscible hydrocarbons. Single liquid phase across the whole composition range in the source papers (see the single-phase evidence below).

# Reference pure densities that take precedence over data-set values.
pure_density_references:
  - smiles: O
    temperature: 298.15
    density: 0.997047
    sigma: 0.000001
    source: "iapws-95:10.1063/1.1461829"
  - smiles: O
    temperature: 303.15
    density: 0.995649
    sigma: 0.000001
    source: "iapws-95:10.1063/1.1461829"
  - smiles: c1ccncc1
    temperature: 303.15
    density: 0.97298
    sigma: 0.000107
    source: "thermoml:10.1021/je900874z"
  # The formamide + 1-propanol block of 10.1016/j.jct.2006.07.021 lists pure
  # formamide twice, as 1.133 and 1.129 g/mL; the paper's other blocks and 13
  # other ThermoML papers give 1.1288 to 1.1297 g/mL.
  - smiles: O
    temperature: 323.15
    density: 0.988036
    sigma: 0.000001
    source: "iapws-95:10.1063/1.1461829"
  - smiles: NC=O
    temperature: 298.15
    density: 1.129
    sigma: 0.000165
    source: "thermoml:10.1016/j.jct.2006.07.021"

# Systems considered and dropped, for the report.
dropped:
  - system: 2,2,2-trifluoroethanol + methanol
    a: OCC(F)(F)F
    b: CO
    reason: >-
      Added on 2026-11-05 for fluorine and replaced the same day by ethyl
      acetate + ethanol, as an ester was judged more important and both did
      not fit the atom budget. Kept as a reserve (-0.85 kJ/mol,
      10.1016/j.tca.2007.04.012; fails only the rc2 composition-match check).
  - system: formamide + 1-propanol
    a: NC=O
    b: CCCO
    reason: >-
      Added on 2026-11-05 for the amide N-H and replaced the same day by
      N-methylacetamide + water, which models the peptide bond itself, to stay
      within the atom budget. Kept as a reserve (+0.74 kJ/mol; ΔHmix from
      10.1016/j.tca.2013.02.010, densities from 10.1016/j.jct.2006.07.021);
      a primary amide like the asparagine and glutamine side chains.
  - system: tetrahydropyran + ethanol
    a: C1CCOCC1
    b: CCO
    reason: >-
      Replaced by 1-methylimidazole + ethanol on 2026-11-05 to cover the
      imidazole group at about the same cost; its ether acceptor is still
      covered by propionitrile + tert-amyl ethyl ether.
  - system: 2-(dimethylamino)ethanol + methanol
    a: CN(C)CCO
    b: CO
    reason: >-
      Dropped for cost on 2026-10-29 (13 to 10 systems). MLP runs would start
      from Sage's conformer populations, which could hide a model that favours
      the wrong O-C-C-N conformer; it had the largest gaps from the published
      1000-molecule Sage runs (ΔHmix -0.35 kJ/mol, z = -3.6, at x = 0.75); and
      its O-H···N and O-H···O association partly overlaps methanol + water and
      1-propanol + benzene.
  - system: methyl pentanoate + octane
    a: CCCCC(=O)OC
    b: CCCCCCCC
    reason: >-
      Dropped for cost on 2026-10-29 (13 to 10 systems). The most expensive
      system (11 % of the atoms, with 2,000- and 2,600-atom pure boxes), and
      its dipole dilution is close to propionitrile + tert-amyl ethyl ether.
  - system: 2-butanone + dibutylamine
    a: CCC(C)=O
    b: CCCCNCCCC
    reason: >-
      Dropped for cost on 2026-10-29 (13 to 10 systems). The second most
      expensive system (10 % of the atoms, with a 2,800-atom dibutylamine
      box) and the weakest signal (+0.42 to +0.62 kJ/mol, near the
      0.4 kJ/mol floor); dipropylamine + DMF still covers secondary amines.
  - system: 2-(dimethylamino)ethanol + water
    a: CN(C)CCO
    b: O
    reason: Sage repeat SD 0.126 kJ/mol (above the 0.10 limit).
  - system: 2-pyrrolidone + water
    a: O=C1CCCN1
    b: O
    reason: >-
      Viscous lactam that melts at ~25 °C
      ([PubChem](https://pubchem.ncbi.nlm.nih.gov/compound/12025#section=Melting-Point)).
      The Sage data sets and benchmarks encode it as the imidic acid tautomer
      OC1=NCCC1 (e.g. [Sage 2.0 training set](https://github.com/openforcefield/openff-sage/blob/a6a061ba8ebc144e3fda46f5f7a9e7a352b9cd2f/data-set-curation/physical-property/optimizations/data-sets/sage-train-v1.csv?plain=1#L145),
      [rc2 training set](https://github.com/openforcefield/ash-sage-rc2/blob/00c9524d38af53725a1a18feb3433f5c191cdb4a/01_download-data/physprop/final/output/training-set.csv?plain=1#L769),
      [rc2 benchmark, openff-2.0.0](https://github.com/openforcefield/ash-sage-rc2/blob/00c9524d38af53725a1a18feb3433f5c191cdb4a/04_benchmark/phys-prop/output/training/summary-benchmarks-EnthalpyOfMixing.csv?plain=1#L2843)), so the published Sage
      repeat SDs are for a different molecule. The rc2 enthalpy uncertainties
      are a flat 25 % placeholder (σ = 0.1695 for ΔHmix = -0.678 kJ/mol,
      [same rc2 row](https://github.com/openforcefield/ash-sage-rc2/blob/00c9524d38af53725a1a18feb3433f5c191cdb4a/01_download-data/physprop/final/output/training-set.csv?plain=1#L769)).
  - system: piperidine + water
    a: C1CCNCC1
    b: O
    reason: >-
      Dropped after the Sage reference run (2026-10-20). Nitrogen inversion is
      frozen in Sage (no axial/equatorial N-H interconversion in 2.2 ns, or in
      a 500 K anneal), and the real barrier (ΔG‡ = 6.1 kcal/mol ≈ 25 kJ/mol,
      [Anet and Yavari 1977](https://doi.org/10.1021/ja00450a064)) suggests ns
      lifetimes for MLIPs too, so ΔHmix depended on the starting N-H
      orientation by ~0.3 kJ/mol. It also showed the largest box-size gap
      against the published 1000-molecule Sage run (-0.35 kJ/mol at x = 0.25;
      [published openff-2.2.1 value](https://github.com/openforcefield/ash-sage-rc2/blob/00c9524d38af53725a1a18feb3433f5c191cdb4a/04_benchmark/phys-prop/output/training/summary-benchmarks-EnthalpyOfMixing.csv?plain=1#L4806)) and is microheterogeneous
      for x between 0.08 and 0.5 ([arXiv:2203.01224](https://arxiv.org/abs/2203.01224)).
  - system: ethanol + water
    a: CCO
    b: O
    reason: Already covered by the [ethanol_water_density](https://github.com/ddmms/ml-peg/tree/8e52132f661fb3d46d5a245aa52b1d940ba22504/ml_peg/calcs/molecular_dynamics/ethanol_water_density) benchmark.
  - system: pyrrole + benzene
    a: c1cc[nH]c1
    b: c1ccccc1
    reason: Smallest signal and Sage already reproduces it; kept as a reserve.
  - system: isooctane + 1-propanol
    a: CC(C)CC(C)(C)C
    b: CCCO
    reason: Replaced by 1-propanol + benzene (adds O-H···π, single-paper data).
  - system: methyl pentanoate + methanol
    a: CCCCC(=O)OC
    b: CO
    reason: Replaced to reduce the number of alcohol systems.
  - system: NMP + 1,4-dichlorobutane
    a: CN1CCCC1=O
    b: ClCCCCCl
    reason: Replaced by NMP + 1,2-dichloroethane to widen the exothermic range.

# Systems from the recommended fast-converging list that look two-phase.
two_phase_fast_set:
  - a: CC(=O)c1ccccc1
    b: O
    names: [acetophenone, water]
    lle: >-
      Aqueous solubility is 6.13 g/L at 25 °C (x ≈ 0.001; Southworth and Keller 1986, via [PubChem](https://pubchem.ncbi.nlm.nih.gov/compound/7410#section=Solubility)), and the H^E slopes between x = 0.2, 0.5 and 0.8 are identical (0.677 and 0.671 kJ/mol), the lever-rule signature. The water content of the organic-rich phase was not found; confirm against the IUPAC-NIST Solubility Data Series.
  - a: CC(=O)CC(C)=O
    b: O
    names: [acetylacetone, water]
    lle: >-
      Binary mutual solubilities in ThermoML ([10.1016/j.fluid.2010.11.029](https://trc.nist.gov/ThermoML/10.1016/j.fluid.2010.11.029.json)): at 298.15 K the aqueous phase holds an acetylacetone mass fraction of 0.158 (x ≈ 0.033), and the organic phase holds 3–6 wt% water between 288 and 313 K (x(acetylacetone) ≈ 0.75–0.85). The measured compositions (x = 0.2–0.75) are therefore two-phase.
  - a: CCOC(=O)CC(C)=O
    b: O
    names: [ethyl acetoacetate, water]
    lle: >-
      Aqueous solubility is 2.86 g/100 mL at 20 °C (x ≈ 0.004; ICSC, via [PubChem](https://pubchem.ncbi.nlm.nih.gov/compound/8868#section=Solubility)). PubChem also lists 110 g/L at 17 °C (AQUASOL, x ≈ 0.016); the sources disagree and no primary measurement was checked, but either value puts x = 0.2 inside the two-phase region. H^E/x is roughly constant (slopes 1.71 and 1.47 kJ/mol); x = 0.75 may lie near the organic-rich phase boundary.

reserves:
  - system: 2,2,2-trifluoroethanol + methanol
  - system: formamide + 1-propanol
  - system: pyrrole + benzene
  - system: cyclohexane + benzene
  - system: methyl pentanoate + methanol
  - system: NMP + 1,4-dichlorobutane
  - system: isooctane + 1-propanol
  - system: propyl acetate + 1,2-dichloroethane
  # N-H amide systems found during stage 1. Reviewed 2026-10-23 and not
  # added yet; kept as reserves.
  - system: N-methylformamide + o-toluidine (308.15 K)
    a: CNC=O
    b: Cc1ccccc1N
    note: >-
      Closes the N-H amide gap. ThermoML ([10.1016/j.tca.2011.06.020](https://trc.nist.gov/ThermoML/10.1016/j.tca.2011.06.020.json)) has 18
      enthalpy points (-0.41 / -0.76 / -0.61 kJ/mol at x = 0.22 / 0.52 / 0.77)
      and 18 densities at 308.15 K, all with uncertainties, plus same-paper pure
      densities; strongly single-phase. Costs 5 extra boxes at 308.15 K (3
      mixtures plus N-methylformamide and o-toluidine pure boxes) and needs our
      own Sage replicates, as there are no published Sage errors. Single
      research group; worth a cross-check against an independent source.
  - system: N-methylformamide + tetrahydropyran (308.15 K)
    a: CNC=O
    b: C1CCOCC1
    note: >-
      Same paper, +0.32 kJ/mol at equimolar: below the 0.4 kJ/mol signal floor.
  - system: N-methylformamide + 2-chlorotoluene (308.15 K)
    a: CNC=O
    b: Cc1ccccc1Cl
    note: >-
      ThermoML [10.1016/j.jct.2013.12.006](https://trc.nist.gov/ThermoML/10.1016/j.jct.2013.12.006.json), +0.49 kJ/mol at equimolar, 18 points
      of each property with uncertainties. Same research group.

# Functional groups the selection should cover, chosen for their biological
# importance. `select_systems.py` fails if a required group is neither in a
# curated system nor listed in `known_gaps`, and `screen_archive.py` searches
# the ThermoML archive for systems containing any of them.
functional_groups:
  # Acyclic, so lactams (cis amides) do not count; carbamates and ureas are
  # excluded. N-methylformamide matches
  # but is not used: its ~10 % cis fraction would stay frozen at its starting
  # value, as amide rotation is far slower than a 1 ns run.
  - name: N-H amide
    smarts: "[NX3;H1,H2;!R][CX3;!R;!$(C[OX2]);!$(C(N)N)](=O)"
    required: true
  - name: secondary amide (peptide-like)
    smarts: "[NX3H1;!R][CX3;!R;!$(C[OX2]);!$(C(N)N)](=O)[#6]"
  # Acyclic C(=O)-O-C, formates included; not carbamates, carbonates or
  # anhydrides.
  - name: ester
    smarts: "[#6][OX2;!R][CX3;!R;!$(C(N)=O);!$(C(O)(O)=O);!$(C(=O)OC=O)](=O)"
  - name: carboxylic acid
    smarts: "[CX3](=O)[OX2H1]"
  - name: imidazole
    smarts: "c1ncn[c]1"
  - name: carbamate
    smarts: "[NX3][CX3](=O)[OX2][#6]"
  - name: sulfur
    smarts: "[#16]"
  - name: fluorine
    smarts: "[F]"

# Groups the set already covers, shown in the report's coverage matrix so
# overlap between systems is visible. Not screened for.
other_groups:
  - {name: water, smarts: "[OX2H2]"}
  - {name: alcohol, smarts: "[CX4][OX2H1]"}
  - {name: aromatic N acceptor, smarts: "[nX2]"}
  - {name: aromatic N-H, smarts: "[nH]"}
  - {name: amine, smarts: "[NX3;!$(N-C=[O,N,S]);!$(N-S=O)]"}
  - {name: tertiary amide, smarts: "[NX3H0][CX3](=O)"}
  - {name: ketone, smarts: "[#6][CX3](=O)[#6]"}
  - {name: ether, smarts: "[OD2;!$(O-C=O)]([#6])[#6]"}
  - {name: nitrile, smarts: "C#N"}
  - {name: chloroalkane, smarts: "[CX4]Cl"}
  - {name: aromatic ring, smarts: "a"}

# Required or wanted groups the selection does not cover, with the reason.
known_gaps:
  - group: fluorine
    reason: >-
      Dropped for cost in favour of an ester. 2,2,2-Trifluoroethanol +
      methanol (-0.85 kJ/mol) and THF + TFE (-1.96 kJ/mol) pass but did not
      fit the atom budget.
  - group: carboxylic acid
    reason: >-
      None in the Sage sets; the only acid system in the ThermoML archive
      screen (acetic acid + acetic anhydride) fails the signal floor.
  - group: carbamate
    reason: No carbamate system in the Sage sets or the ThermoML archive screen.
  - group: sulfur
    reason: >-
      Dropped for cost. 1-Propanol + DMSO (+0.81 kJ/mol) passes the ThermoML
      archive screen but did not fit the atom budget.
