# SMILES for the liquids in ml-peg's liquid_densities benchmark, keyed by the
# xyz file stem in liquid_densities.zip. Used to avoid re-scoring pure-liquid
# densities that ml-peg already benchmarks. `select_systems.py` checks each
# SMILES against the atom counts of the corresponding box.
