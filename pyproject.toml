[project]
name = "liquid-mixtures-inputs"
version = "0.1.0"
description = "System selection, Sage box building and Sage reference runs for the ml-peg binary_mixtures benchmark."
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Finlay Clark" }]
# Dependencies are managed by pixi (see pixi.toml): the OpenFF stack is conda-only.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/liquid_mixtures_inputs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Lint settings copied from ml-peg, so code moves between the repos cleanly.
[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Ignore complexity
ignore = ["C901"]
select = ["B", "C", "R", "D", "E", "W", "F", "FA", "I", "N", "UP"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["liquid_mixtures_inputs", "ml_peg"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = false

[tool.numpydoc_validation]
checks = ["all", "EX01", "SA01", "ES01", "PR04"]
exclude = [".__weakref__$", ".__repr__$"]
